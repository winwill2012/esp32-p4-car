location = /p4-intercom/ {
    proxy_pass http://127.0.0.1:18128/p4-intercom/rtc/;
    proxy_set_header Host $host;
    proxy_buffering off;
}

location ^~ /p4-intercom/rtc/ {
    proxy_pass http://127.0.0.1:18128;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 45s;
    proxy_buffering off;
}
